name: Create GitHub Release from Tag

# Trigger: annotated tag pushed (vX.Y.Z)
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether this tag already has release notes
        id: existing
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.GITHUB_REF_NAME
              });
              return !data.draft && Boolean(data.body?.trim());
            } catch (error) {
              if (error.status === 404) return false;
              throw error;
            }

      - name: Generate release notes from merged PRs and labels
        if: steps.existing.outputs.result == 'false'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_release_notes.py /tmp/release_body.md

      - name: Create GitHub Release
        if: steps.existing.outputs.result == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          generate_release_notes: false
