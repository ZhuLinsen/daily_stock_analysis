name: Daily Stock Analysis

on:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: '模式'
        required: false
        default: 'full'
      force_run:
        description: '强制运行 (跳过交易日检查)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行股票分析
        env:
          STOCK_LIST: "603986,300308"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
        # 关键修改在这里：显式传入参数
         run: |
           python main.py --force_run=${{ github.event.inputs.force_run }}

