name: Sync Upstream

on:
  schedule:
    - cron: '17 21 * * *'  # 北京时间每日 05:17 检查上游更新
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate upstream sync credential
        id: auth
        continue-on-error: true
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::UPSTREAM_SYNC_TOKEN is not configured."
            exit 1
          fi
          repo_info="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${UPSTREAM_SYNC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          if ! jq --exit-status '.permissions.push == true' <<<"$repo_info" >/dev/null; then
            echo "::error::UPSTREAM_SYNC_TOKEN cannot write to ${GITHUB_REPOSITORY}."
            exit 1
          fi

      - name: Checkout current main
        id: checkout
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # The default GITHUB_TOKEN cannot publish upstream changes that touch
          # workflow files. This fine-grained PAT is limited to this repository
          # with Contents and Workflows write permissions.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Detect upstream updates
        id: detect
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch --prune upstream main --tags
          ahead_count="$(git rev-list --count HEAD..upstream/main)"
          echo "ahead_count=$ahead_count" >> "$GITHUB_OUTPUT"
          if [ "$ahead_count" -gt 0 ]; then
            echo "update_available=true" >> "$GITHUB_OUTPUT"
            echo "Found $ahead_count new upstream commit(s)."
          else
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already up to date."
          fi

      - name: Merge upstream main
        id: merge
        if: steps.detect.outputs.update_available == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git merge --no-edit upstream/main; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ',' -)"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate personal automation contract
        id: validate
        if: steps.merge.outputs.status == 'success'
        continue-on-error: true
        run: |
          python .github/scripts/validate_personal_automation.py
          python scripts/check_ai_assets.py
          python -m py_compile main.py scripts/select_intraday_candidates.py

      - name: Push validated update to main
        id: push
        if: steps.merge.outputs.status == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        run: git push origin HEAD:main

      - name: Create a maintenance issue when automatic sync is blocked
        if: >-
          always() && (
          steps.auth.outcome == 'failure' ||
          steps.checkout.outcome == 'failure' ||
          steps.detect.outcome == 'failure' ||
          (steps.detect.outputs.update_available == 'true' &&
          (steps.merge.outputs.status != 'success' ||
          steps.validate.outcome != 'success' || steps.push.outcome != 'success')))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="chore: automatic upstream sync needs attention"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="上游自动同步未能安全完成。

          - credential=${AUTH_OUTCOME:-skipped}
          - checkout=${CHECKOUT_OUTCOME:-skipped}
          - detect=${DETECT_OUTCOME:-skipped}
          - merge=${MERGE_STATUS:-skipped}
          - conflicts=${CONFLICTS:-none}
          - validate=${VALIDATE_OUTCOME:-skipped}
          - push=${PUSH_OUTCOME:-skipped}
          - run=${RUN_URL}"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "$title" \
              --body "$body"
          else
            gh issue comment "$existing" --body "$body"
            echo "Updated maintenance issue #$existing."
          fi

      - name: Send Telegram alert when automatic sync is blocked
        if: >-
          always() && (
          steps.auth.outcome == 'failure' ||
          steps.checkout.outcome == 'failure' ||
          steps.detect.outcome == 'failure' ||
          (steps.detect.outputs.update_available == 'true' &&
          (steps.merge.outputs.status != 'success' ||
          steps.validate.outcome != 'success' || steps.push.outcome != 'success')))
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram sync alert skipped: credentials are not configured."
            exit 0
          fi
          message="⚠️ 上游自动同步未完成
          credential=${AUTH_OUTCOME:-skipped}
          checkout=${CHECKOUT_OUTCOME:-skipped}
          detect=${DETECT_OUTCOME:-skipped}
          merge=${MERGE_STATUS:-skipped}
          conflicts=${CONFLICTS:-none}
          validate=${VALIDATE_OUTCOME:-skipped}
          push=${PUSH_OUTCOME:-skipped}
          ${RUN_URL}"
          args=(
            --fail --silent --show-error --retry 2
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
            --data-urlencode "text=${message}"
          )
          if [ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]; then
            args+=(--data-urlencode "message_thread_id=${TELEGRAM_MESSAGE_THREAD_ID}")
          fi
          curl "${args[@]}" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Close maintenance issue after recovery
        if: >-
          always() && steps.auth.outcome == 'success' &&
          steps.checkout.outcome == 'success' &&
          steps.detect.outcome == 'success' &&
          (steps.detect.outputs.update_available != 'true' ||
          (steps.merge.outputs.status == 'success' &&
          steps.validate.outcome == 'success' && steps.push.outcome == 'success'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="chore: automatic upstream sync needs attention"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "自动同步链路已恢复：${RUN_URL}"
            gh issue close "$existing" --reason completed
          else
            echo "No open maintenance issue needs closing."
          fi

      - name: Fail when update was not published
        if: >-
          always() && (
          steps.auth.outcome == 'failure' ||
          steps.checkout.outcome == 'failure' ||
          steps.detect.outcome == 'failure' ||
          (steps.detect.outputs.update_available == 'true' &&
          (steps.merge.outputs.status != 'success' ||
          steps.validate.outcome != 'success' || steps.push.outcome != 'success')))
        run: exit 1
