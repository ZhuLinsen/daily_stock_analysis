name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 🔎 Change Detection
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend-filter.outputs.backend_non_web == 'true' || steps.filter.outputs.backend_web_contract == 'true' || (github.event_name != 'pull_request' && steps.filter.outputs.backend_contract_assets == 'true') }}
      backend_docs: ${{ steps.filter.outputs.backend_contract_assets }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.frontend-filter.outputs.frontend_code }}
      frontend_runtime: ${{ steps.frontend-filter.outputs.frontend_runtime }}
      desktop: ${{ steps.desktop-filter.outputs.desktop_code }}
      site: ${{ steps.site-filter.outputs.site_code }}
      futu_packaging: ${{ steps.filter.outputs.futu_packaging }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🧭 Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            backend_contract_assets:
              # These docs and fixtures are executable contracts consumed by
              # offline backend tests, so Markdown/docs-only changes still run them.
              - '{THIRD_PARTY_NOTICES.md,docs/CHANGELOG.md,docs/INDEX.md,docs/INDEX_EN.md,docs/DEPLOY.md,docs/DEPLOY_EN.md,docs/alerts.md,docs/analysis-context-pack.md,docs/decision-signals.md,docs/full-guide.md,docs/full-guide_EN.md,docs/notifications.md,docs/architecture/**,docs/docker/zeabur-deployment.md,tests/fixtures/**}'
            backend_web_contract:
              # Public assets are shared runtime inputs: Python loaders and
              # packaged deployments may consume them outside the Web app.
              - '{apps/dsa-web/public/**,apps/dsa-web/src/components/settings/llmProviderTemplates.ts,apps/dsa-web/src/locales/settingsHelp.ts}'
              - '!**/*.md'
            docker:
              # Keep runtime inputs covered for Dockerfile build/import smoke, while skipping
              # frontend test-only and Markdown-only changes on PRs.
              - '{*.py,api/**,bot/**,data_provider/**,src/**,strategies/**,apps/dsa-web/**,docker/**,requirements.txt,.dockerignore,.github/workflows/ci.yml}'
              - '!**/*.md'
              - '!apps/dsa-web/src/**/__tests__/**'
              - '!apps/dsa-web/**/*.test.ts'
              - '!apps/dsa-web/**/*.test.tsx'
              - '!apps/dsa-web/tests/**'
              - '!apps/dsa-web/e2e/**'
            futu_packaging:
              - '{requirements.txt,main.py,src/brokers/futu/**,scripts/build-backend.ps1,scripts/build-backend-macos.sh,scripts/macos-signature-audit.sh,scripts/build-all.ps1,scripts/build-all-macos.sh,apps/dsa-desktop/**,.github/workflows/ci.yml,.github/workflows/release.yml}'
              - '!**/*.md'
      - name: 🧭 Filter backend-safe frontend paths
        id: backend-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            backend_non_web:
              - '**'
              - '!apps/dsa-web/**'
              - '!apps/dsa-site/**'
              - '!docs/**'
              - '!tests/fixtures/**'
              - '!**/*.md'
              - '!LICENSE'
      - name: 🧭 Filter frontend code paths
        id: frontend-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            frontend_code:
              - 'apps/dsa-web/**'
              - '!**/*.md'
            frontend_runtime:
              - 'apps/dsa-web/**'
              - '!**/*.md'
              - '!apps/dsa-web/src/**/__tests__/**'
              - '!apps/dsa-web/**/*.test.ts'
              - '!apps/dsa-web/**/*.test.tsx'
              - '!apps/dsa-web/tests/**'
      - name: 🧭 Filter desktop code paths
        id: desktop-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            desktop_code:
              - 'apps/dsa-desktop/**'
              - '!**/*.md'
      - name: 🧭 Filter docs site paths
        id: site-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            site_code:
              - '{apps/dsa-site/**,docs/**,strategies/README.md,.github/workflows/ci.yml}'

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 🤖 Check AI governance assets
        run: python scripts/check_ai_assets.py

  backend-tests:
    name: backend-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          for attempt in 1 2 3; do
            if uv pip install --system -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
      - name: 🔌 Verify global Futu SDK
        if: matrix.shard == 1
        run: python -c "import futu; print('✅ futu SDK import OK')"
      - name: ✅ Python syntax check
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh deterministic
      - name: ✅ Offline test suite shard ${{ matrix.shard }}/3
        env:
          PYTEST_SPLITS: '3'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '20'
        run: ./scripts/ci_gate.sh offline-tests

  docs-contract-tests:
    name: docs-contract-tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.backend_docs == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          for attempt in 1 2 3; do
            if uv pip install --system -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
      - name: ✅ Docs and fixture contract tests
        run: |
          mapfile -t files < <(grep -lE '\bdocs\b|THIRD_PARTY_NOTICES|\bfixtures\b' tests/test_*.py)
          echo "Running ${#files[@]} docs/fixture contract test files"
          python -m pytest -m "not network" -q "${files[@]}"

  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    needs: [changes, ai-governance, backend-tests, docs-contract-tests]
    if: always()
    steps:
      - name: ✅ Summarize backend gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_GOVERNANCE_RESULT: ${{ needs.ai-governance.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          BACKEND_DOCS_REQUIRED: ${{ needs.changes.outputs.backend_docs }}
          DOCS_CONTRACT_RESULT: ${{ needs.docs-contract-tests.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ] || [ "$AI_GOVERNANCE_RESULT" != "success" ]; then
            echo "Prerequisite failed: changes=$CHANGES_RESULT ai-governance=$AI_GOVERNANCE_RESULT" >&2
            exit 1
          fi
          if [ "$BACKEND_REQUIRED" = "true" ]; then
            if [ "$BACKEND_TESTS_RESULT" != "success" ]; then
              echo "Backend shards did not all pass: $BACKEND_TESTS_RESULT" >&2
              exit 1
            fi
          elif [ "$BACKEND_DOCS_REQUIRED" = "true" ] && [ "$DOCS_CONTRACT_RESULT" != "success" ]; then
            echo "Docs contract tests did not pass: $DOCS_CONTRACT_RESULT" >&2
            exit 1
          fi
          echo "backend-gate passed (required=$BACKEND_REQUIRED, shards=$BACKEND_TESTS_RESULT, docs_required=$BACKEND_DOCS_REQUIRED, docs=$DOCS_CONTRACT_RESULT)"

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || github.event_name != 'pull_request'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🐳 Build image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: '7'
        with:
          context: .
          file: docker/Dockerfile
          tags: stock-analysis:test
          load: true
          cache-from: type=gha,scope=stock-analysis-ci-docker
          cache-to: type=gha,mode=max,scope=stock-analysis-ci-docker,ignore-error=true
      - name: 🐳 Docker smoke
        run: docker run --rm stock-analysis:test python -c "print('✅ Docker OK')"
      - name: 🔍 Docker smoke imports
        run: |
          docker run --rm stock-analysis:test python -c "
          from src.config import get_config; print('✅ config')
          from src.storage import DatabaseManager; print('✅ storage')
          from src.notification import NotificationService; print('✅ notification')
          from data_provider import DataFetcherManager; print('✅ data_provider')
          from src.analyzer import GeminiAnalyzer; print('✅ analyzer')
          from src.patches.eastmoney_patch import eastmoney_patch; print('✅ patch')
          from bot.dispatcher import CommandDispatcher; print('✅ bot')
          from api.app import app; print('✅ api')
          import futu; print('✅ futu')
          print('✅ All Docker imports OK')
          "

  desktop-tests:
    name: desktop-tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        working-directory: apps/dsa-desktop
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: 🧪 Run desktop unit tests
        run: npm test

  desktop-futu-package-windows:
    name: desktop-futu-package-windows
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.futu_packaging == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install Web dependencies
        shell: pwsh
        run: npm ci --prefix apps/dsa-web
      - name: 🧊 Build and verify frozen backend
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

  desktop-futu-package-macos:
    name: desktop-futu-package-macos
    runs-on: macos-15
    needs: [changes]
    if: needs.changes.outputs.futu_packaging == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install Web dependencies
        run: npm ci --prefix apps/dsa-web
      - name: 🧊 Build and verify frozen backend
        run: bash scripts/build-backend-macos.sh
      - name: 📦 Build and verify unsigned desktop package
        run: bash scripts/build-desktop-macos.sh

  web-gate:
    name: web-gate
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install
        run: npm ci
      - name: 🔎 Lint
        run: npm run lint
      - name: 🧪 Unit tests
        run: npm test
      - name: 🏗️ Build
        if: needs.changes.outputs.frontend_runtime == 'true' || github.event_name != 'pull_request'
        run: npm run build
      - name: 🗂️ Cache Playwright browsers
        id: playwright-cache
        if: needs.changes.outputs.frontend_runtime == 'true' || github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/dsa-web/package-lock.json') }}
      - name: 🌐 Install fixture browser
        if: needs.changes.outputs.frontend_runtime == 'true' || github.event_name != 'pull_request'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: 🧪 Verify default smoke without backend credentials
        if: needs.changes.outputs.frontend_runtime == 'true' || github.event_name != 'pull_request'
        env:
          DSA_WEB_SMOKE_PASSWORD: ''
        run: npm run test:smoke
      - name: 📸 Verify deterministic UI fixtures
        if: needs.changes.outputs.frontend_runtime == 'true' || github.event_name != 'pull_request'
        run: npx playwright test --config playwright.fixture.config.ts
      - name: 📎 Upload UI evidence
        if: always() && (needs.changes.outputs.frontend_runtime == 'true' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@v6
        with:
          name: web-ui-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/dsa-web/test-results/fixtures/
          if-no-files-found: warn
          retention-days: 7

  site-gate:
    name: site-gate
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.site == 'true'
    defaults:
      run:
        working-directory: apps/dsa-site
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/dsa-site/package-lock.json
      - name: 📦 Install
        run: npm ci
      - name: 🏗️ Build docs site
        run: npm run build
      - name: 🧪 Verify site contracts
        run: npm test

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - ai-governance
      - backend-gate
      - web-gate
      - desktop-tests
      - site-gate
      - docker-build
      - desktop-futu-package-windows
      - desktop-futu-package-macos
    if: always()
    steps:
      - name: ✅ Summarize CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_GOVERNANCE_RESULT: ${{ needs.ai-governance.result }}
          BACKEND_GATE_RESULT: ${{ needs.backend-gate.result }}
          WEB_GATE_RESULT: ${{ needs.web-gate.result }}
          DESKTOP_TESTS_RESULT: ${{ needs.desktop-tests.result }}
          SITE_GATE_RESULT: ${{ needs.site-gate.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          DESKTOP_WIN_RESULT: ${{ needs.desktop-futu-package-windows.result }}
          DESKTOP_MAC_RESULT: ${{ needs.desktop-futu-package-macos.result }}
        run: |
          for required in \
            "changes:$CHANGES_RESULT" \
            "ai-governance:$AI_GOVERNANCE_RESULT" \
            "backend-gate:$BACKEND_GATE_RESULT"; do
            name="${required%%:*}"
            result="${required#*:}"
            if [ "$result" != "success" ]; then
              echo "Required job failed: $name=$result" >&2
              exit 1
            fi
          done
          for optional in \
            "web-gate:$WEB_GATE_RESULT" \
            "desktop-tests:$DESKTOP_TESTS_RESULT" \
            "site-gate:$SITE_GATE_RESULT" \
            "docker-build:$DOCKER_BUILD_RESULT" \
            "desktop-futu-package-windows:$DESKTOP_WIN_RESULT" \
            "desktop-futu-package-macos:$DESKTOP_MAC_RESULT"; do
            name="${optional%%:*}"
            result="${optional#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Triggered job did not succeed: $name=$result" >&2
              exit 1
            fi
          done
          echo "ci-gate passed"
