name: Network Smoke

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: network-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🌐 Run pytest network smoke
        id: network_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -m network -q | tee pytest-network.log

      - name: 🚀 Run quick smoke
        id: quick_smoke
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/test.sh quick --no-notify | tee quick-smoke.log

      - name: 📤 Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: network-smoke-logs-${{ github.run_number }}
          path: |
            pytest-network.log
            quick-smoke.log
          if-no-files-found: ignore

      - name: ✅ Enforce minimum network viability
        if: always()
        env:
          NETWORK_TESTS_OUTCOME: ${{ steps.network_tests.outcome }}
          QUICK_SMOKE_OUTCOME: ${{ steps.quick_smoke.outcome }}
        run: |
          echo "pytest network smoke: ${NETWORK_TESTS_OUTCOME}"
          echo "quick smoke: ${QUICK_SMOKE_OUTCOME}"
          {
            echo "## Network Smoke viability"
            echo "- pytest network smoke: ${NETWORK_TESTS_OUTCOME}"
            echo "- quick smoke: ${QUICK_SMOKE_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$NETWORK_TESTS_OUTCOME" != "success" ] && [ "$QUICK_SMOKE_OUTCOME" != "success" ]; then
            echo "Both network validation paths failed; minimum viability was not met."
            exit 1
          fi

      - name: Telegram 网络冒烟失败告警
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram network alert skipped: credentials are not configured."
            exit 0
          fi
          message="❌ 网络冒烟检查未达到最低可用阈值
          仓库：${GITHUB_REPOSITORY}
          运行：${RUN_URL}"
          args=(
            --fail --silent --show-error --retry 2
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
            --data-urlencode "text=${message}"
          )
          if [ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]; then
            args+=(--data-urlencode "message_thread_id=${TELEGRAM_MESSAGE_THREAD_ID}")
          fi
          curl "${args[@]}" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
