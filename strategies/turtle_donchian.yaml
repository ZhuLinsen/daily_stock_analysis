# Turtle Donchian Trend Following Strategy / 海龟唐奇安趋势策略

name: turtle_donchian
display_name: 海龟唐奇安趋势
description: 经典海龟交易法则，以20日唐奇安高点突破入场、10日低点或2倍ATR动态止损并按波动率控制仓位。
