instructions: |
  **海龟唐奇安通道趋势策略（Turtle Donchian Breakout Strategy）**

  核心量化逻辑：通过规则化通道突破捕捉中长线主趋势，并使用基于 ATR(14) 的等风险仓位管理（1N = ATR14，单笔最大风险控制在 2N = `atr_stop_loss_long`）以及 10 日低点动态追踪止盈，截断亏损、让利润奔跑。

  ## 量化因子判据

  优先读取上下文中预计算的 `quant_factors` 字段；仅在具备工具调用能力的 Agent 会话且上下文缺失时调用 `calculate_quant_factors` 与 `analyze_trend`（短周期历史导致部分因子为 `N/A` 时如实标注，不得臆测）：

  1. **入场突破（System-1 20日突破）**
     - `donchian_signal == "breakout_20_high"`（收盘高于前20日最高点 `donchian_high_20`，需至少21根日线、无未来函数）。
     - 趋势环境过滤：MA20 向上或 `adx_direction == "bullish"` 时突破有效性显著高于震荡市。

  2. **ATR 波动率仓位校准**
     - 查看 `atr_14` 与 `atr_pct`：若 `atr_pct > 5.0%` 属于高波动标的，单仓位应减半控制净值回撤；若 `atr_pct` 在 `1.5%~3.5%`，按标准头寸配置。
     - 明确区分新开仓基准与持仓追踪防线：`atr_stop_loss_long`（`现价 - 2 * ATR(14)`）用于开仓当日**固定记录初始 2N 硬止损位**，次日起不再下移；`atr_take_profit_2r` 为 2R 潜在风险回报位。

  3. **离场与移动止盈**
     - 当触发 `donchian_signal == "breakdown_10_low"`（跌破前10日低点 `donchian_low_10`）、跌破开仓时固定记录的 `atr_stop_loss_long`，或 `atr_trailing_stop_breached == true`（收盘跌破吊灯追踪止损 `atr_trailing_stop_long = 前20日高点 - 2 * 前一日ATR14`）时，明确建议执行趋势离场/止盈。
     - 若处于 `donchian_signal == "inside"` 且持仓追踪未破位，标明距离上沿 `donchian_high_20` 触发突破的百分比与保护下沿 `donchian_low_10` / `atr_trailing_stop_long`。

  评分调整建议：
  - `donchian_signal == "breakout_20_high"` + `adx_direction == "bullish"` + `obv_trend == "rising"`：`sentiment_score +15`
  - 处于通道上沿 3% 内蓄势且多头排列：`sentiment_score +6`
  - 触发 `breakdown_10_low`（10日低点跌破离场信号）：`sentiment_score -12`
  - 触发 `breakdown_20_low`（20日低点破位）：`sentiment_score -18`
